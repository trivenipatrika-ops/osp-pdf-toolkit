name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add AdMob App ID to AndroidManifest
        run: |
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1247625335902562~3475213673"/>\n    </application>#' android/app/src/main/AndroidManifest.xml

      - name: Add Start.io permission and App ID to AndroidManifest
        run: |
          sed -i 's#<application#    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <meta-data android:name="com.startapp.sdk.APPLICATION_ID" android:value="208450951"/>\n    </application>#' android/app/src/main/AndroidManifest.xml

      - name: Add Start.io SDK gradle dependency
        run: |
          cat >> android/app/build.gradle << 'GRADLE_EOF'

          dependencies {
              implementation 'com.startapp:inapp-sdk:5.3.0'
          }
          GRADLE_EOF

      - name: Bump minSdkVersion for Start.io compatibility
        run: |
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle

      - name: Write StartIoPlugin.java (custom Capacitor plugin)
        run: |
          mkdir -p android/app/src/main/java/com/osp/pdftoolkit
          cat > android/app/src/main/java/com/osp/pdftoolkit/StartIoPlugin.java << 'JAVA_EOF'
          package com.osp.pdftoolkit;

          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import com.startapp.sdk.adsbase.Ad;
          import com.startapp.sdk.adsbase.StartAppAd;
          import com.startapp.sdk.adsbase.StartAppSDK;
          import com.startapp.sdk.adsbase.adlisteners.AdEventListener;
          import com.startapp.sdk.ads.banner.Banner;
          import com.startapp.sdk.ads.banner.BannerListener;

          @CapacitorPlugin(name = "StartIo")
          public class StartIoPlugin extends Plugin {

              private StartAppAd interstitialAd;
              private Banner bannerView;
              private boolean interstitialReady = false;

              @PluginMethod
              public void initialize(PluginCall call) {
                  try {
                      String appId = call.getString("appId");
                      boolean testMode = Boolean.TRUE.equals(call.getBoolean("testMode", false));
                      StartAppSDK.init(getActivity(), appId, false);
                      StartAppSDK.setTestAdsEnabled(testMode);
                      StartAppAd.disableSplash();
                      interstitialAd = new StartAppAd(getActivity());
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("StartIo initialize failed: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void showBanner(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      try {
                          if (bannerView != null) {
                              call.resolve();
                              return;
                          }
                          bannerView = new Banner(getActivity(), new BannerListener() {
                              @Override
                              public void onReceiveAd(View view) {}
                              @Override
                              public void onFailedToReceiveAd(View view) {}
                              @Override
                              public void onImpression(View view) {}
                              @Override
                              public void onClick(View view) {}
                          });
                          FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          );
                          params.gravity = Gravity.BOTTOM;
                          bannerView.setBackgroundColor(Color.parseColor("#17212B"));
                          getActivity().addContentView(bannerView, params);
                          call.resolve();
                      } catch (Exception e) {
                          call.reject("showBanner failed: " + e.getMessage());
                      }
                  });
              }

              @PluginMethod
              public void prepareInterstitial(PluginCall call) {
                  if (interstitialAd == null) {
                      call.reject("StartIo not initialized yet");
                      return;
                  }
                  interstitialAd.loadAd(new AdEventListener() {
                      @Override
                      public void onReceiveAd(Ad ad) {
                          interstitialReady = true;
                          call.resolve();
                      }
                      @Override
                      public void onFailedToReceiveAd(Ad ad) {
                          interstitialReady = false;
                          call.reject("Failed to load Start.io interstitial");
                      }
                  });
              }

              @PluginMethod
              public void showInterstitial(PluginCall call) {
                  if (interstitialAd == null || !interstitialReady) {
                      call.reject("Interstitial not ready");
                      return;
                  }
                  getActivity().runOnUiThread(() -> {
                      interstitialAd.showAd();
                  });
                  interstitialReady = false;
                  call.resolve();
              }
          }

          JAVA_EOF

      - name: Register StartIoPlugin in MainActivity.java
        run: |
          cat > android/app/src/main/java/com/osp/pdftoolkit/MainActivity.java << 'JAVA_EOF'
          package com.osp.pdftoolkit;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(StartIoPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }

          JAVA_EOF

      - name: Decode app icon and splash screen
        run: |
          mkdir -p assets
          base64 -d icon-base64.txt > assets/icon.png
          base64 -d splash-base64.txt > assets/splash.png

      - name: Generate launcher icons and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0B1F33' --iconBackgroundColorDark '#0B1F33' --splashBackgroundColor '#0B1F33' --splashBackgroundColorDark '#0B1F33'

      - name: Build debug APK (quick test)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: osp-pdf-toolkit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/osp-release-key.jks

      - name: Add signing config to build.gradle
        run: |
          cat >> android/app/build.gradle << 'GRADLE_EOF'

          android.signingConfigs {
              release {
                  storeFile file('osp-release-key.jks')
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          GRADLE_EOF

      - name: Build SIGNED release AAB and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease

      - name: Upload signed release AAB (for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: osp-pdf-toolkit-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed release APK (for direct install/testing)
        uses: actions/upload-artifact@v4
        with:
          name: osp-pdf-toolkit-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
